name: Release

# Push a tag like v1.2.0 to publish that version to npm as wa-tui.
# Needs the NPM_TOKEN secret (an npm "Automation" or granular token with
# publish rights) under Settings > Secrets and variables > Actions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build and publish to npm
        run: node npm/build.mjs "${GITHUB_REF_NAME}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
