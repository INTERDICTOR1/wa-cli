name: Release

# Push a tag like v1.2.0 to publish that version to npm as wa-terminal.
# Uses npm trusted publishing: no token is stored. Each wa-terminal package
# on npm trusts this workflow (set with `npm trust github`).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm verify this workflow is the publisher

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm with trusted publishing
        run: npm install -g npm@latest

      - name: Build and publish to npm
        run: node npm/build.mjs "${GITHUB_REF_NAME}" --publish
